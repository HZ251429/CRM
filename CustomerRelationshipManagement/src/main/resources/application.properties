spring.application.name=CustomerRelationshipManagement

# Secrets are never stored here. Provide them through environment variables
# (DB_PASSWORD, CRM_SUPERADMIN_PASSWORD, ...) or a git-ignored ./config/application.properties
# next to pom.xml (Spring Boot loads that file automatically). See config/application.properties.example.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crm}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# update adds new tables/columns/indexes automatically; set DDL_AUTO=validate in production once the schema is stable
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# entities have no lazy relations, so no need to keep a DB connection open while JSON is written
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

server.port=8081
# Behind an HTTPS proxy (Caddy in deploy/), set FORWARD_HEADERS=native so the app sees the original https address
# and marks cookies Secure. Leave it off when nothing sits in front of the app.
server.forward-headers-strategy=${FORWARD_HEADERS:none}

# Used only when no super admin exists yet. If the password is empty, a random one is generated and logged once.
crm.superadmin.username=${CRM_SUPERADMIN_USERNAME:superadmin}
crm.superadmin.password=${CRM_SUPERADMIN_PASSWORD:}

# Frontend origin allowed to call the API cross-origin (comma separated). Not needed when using the Vite proxy.
crm.cors.allowed-origins=${CRM_CORS_ORIGINS:http://localhost:5173}

# Session cookie: not readable from JavaScript, sent only to this site
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Login lockout
crm.login.max-failures=5
crm.login.lock-minutes=15

server.error.include-message=always

# compress JSON and static files (large lists shrink 5-10x)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=2048
